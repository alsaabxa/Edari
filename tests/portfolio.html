<!doctype html><meta charset="utf-8"><title>Portfolio regression checks</title>
<button id="run">Run local checks</button><pre id="result">Ready. Run only on localhost with disposable test data.</pre><iframe id="app" src="../index.html" style="width:390px;height:700px;border:1px solid"></iframe>
<script>
const frame=document.querySelector('#app'),result=document.querySelector('#result');
const wait=async fn=>{for(let i=0;i<150;i++){if(await fn())return;await new Promise(r=>setTimeout(r,100))}throw Error('Timed out')};
document.querySelector('#run').onclick=async()=>{
 if(!['localhost','127.0.0.1'].includes(location.hostname))return result.textContent='Use localhost only';
 const w=frame.contentWindow;let d,original;const logs=[];
 const check=(v,message)=>{if(!v)throw Error(message);logs.push('PASS '+message);result.textContent=logs.join('\n')};
 try{
 result.textContent='Running…';await wait(()=>w.eval('typeof portfolioReady!=="undefined"&&portfolioReady'));d=w.document;original=w.eval('structuredClone(S)');
 check(w.eval('DEF().f.evidenceLayout')==='grid','Grid is default');w.eval("S=DEF();S.f.evidenceLayout='single';S.f.amb='اسم تجريبي طويل للمساعد الإداري';S.f.school='مدرسة الاختبار';S.sec.g1.link='https://example.com/evidence?x=1&y=2';pages()");
 await w.ready();
 check(d.querySelector('.ed-cover-background').naturalWidth>1000,'Original cover loads');
 check(d.querySelector('.ed-cover-name').textContent.includes('اسم تجريبي'),'Profile visible on cover');
 check(d.querySelector('.ed-section-link a').href==='https://example.com/evidence?x=1&y=2','Section URL visible and clickable');
 check(d.querySelector('[data-section-qr] canvas'),'Section QR rendered');
 check(!w.safeLink('javascript:alert(1)')&&!w.safeLink('data:text/html,test'),'Unsafe links rejected');
 check([...d.querySelectorAll('.ed-heading')].every(x=>x.offsetTop<100),'Every goal and chapter heading at top');
 const logo=d.querySelectorAll('.ed-side-logo img')[1];check(logo.naturalWidth>0&&logo.offsetWidth<=logo.parentElement.clientWidth,'Sidebar logo loaded within frame');
 for(const width of [320,390,768,1280]){frame.style.width=width+'px';await new Promise(r=>setTimeout(r,200));check(d.documentElement.scrollWidth<=w.innerWidth,'No horizontal overflow at '+width)}
 const src=new w.jspdf.jsPDF({orientation:'portrait'});for(let i=0;i<2;i++){if(i)src.addPage();src.setFontSize(20);src.text('PDF attachment '+(i+1),20,25);for(let j=0;j<20;j++)src.text('Readable test line '+j,20,45+j*10)}
 const input=d.querySelector('[data-up="g1"]'),transfer=new w.DataTransfer();transfer.items.add(new w.File([src.output('blob')],'sample.pdf',{type:'application/pdf'}));input.files=transfer.files;input.dispatchEvent(new w.Event('change',{bubbles:true}));await wait(()=>d.querySelectorAll('.ed-pdf-page').length===2);
 check(d.querySelectorAll('.ed-pdf-page').length===2,'Two-page PDF displayed as two full sheets');
 w.eval("S.f.evidenceLayout='grid';pages()");check(d.querySelectorAll('.ed-evidence-grid .ed-evidence-tile').length===2&&d.querySelectorAll('.ed-evidence-grid').length===1,'Grid groups two PDF pages without losing either');w.eval("S.f.evidenceLayout='single';pages()");
 const state=w.eval('S.sec.g1.items.at(-1)');const before=state.pages;await w.preparePdfAttachments();check(w.eval('S.sec.g1.items.at(-1).pages')===before,'Current PDF previews reused at startup');w.eval('S.sec.g1.items.at(-1).previewVersion=1');await w.preparePdfAttachments();check(w.eval('S.sec.g1.items.at(-1).previewVersion')===2&&w.eval('S.sec.g1.items.at(-1).src')===state.src,'Legacy previews upgraded without changing original');check(state.src.startsWith('data:application/pdf'),'Original PDF retained');
 const image=new w.Image();image.src=state.pages[0];await image.decode();check(image.naturalHeight>=2300,'PDF preview rendered at readable resolution');
 await w.saveDB();const saved=await w.loadDB();check(saved.sec.g1.items.at(-1).src===state.src,'PDF original persisted without alteration');
 await w.ready();const sheet=d.querySelector('.ed-pdf-page').closest('.pg'),body=sheet.querySelector('.ed-body');check(body.scrollHeight<=body.clientHeight+1,'Evidence fits above footer');
 w.eval("S.f.evidenceLayout='grid';const src=S.sec.g1.items[0].pages[0];for(let i=0;i<3;i++)S.sec.g1.items.push({type:'image',src,cap:'صورة تجريبية '+i,summary:'وصف الشاهد'});pages()");
 check(d.querySelectorAll('.ed-evidence-grid').length===2&&d.querySelectorAll('.ed-evidence-tile').length===5,'Five witnesses paginate into grids of four and one');
 // Verify the print cascade using the same print rules, then export the full portfolio.
 const printStyle=d.createElement('style');let printCSS='';
 for(const sheet of d.styleSheets){let rules;try{rules=sheet.cssRules}catch(e){continue}for(const rule of rules)if(rule.conditionText&&rule.conditionText.includes('print'))printCSS+=Array.from(rule.cssRules).map(r=>r.cssText).join('\n')}
 printStyle.id='test-print-rules';printStyle.textContent=printCSS;d.head.append(printStyle);
 await new Promise(r=>setTimeout(r,100));
 const sheets=[...d.querySelectorAll('.pg')];
 check(sheets.every(p=>{const r=p.getBoundingClientRect();return Math.abs(r.width-1122.52)<2&&Math.abs(r.height-631.56)<2}),'Print sheets use identical landscape dimensions');
 check([...d.querySelectorAll('.ed-body')].every(x=>x.scrollHeight<=x.clientHeight+1),'All printed text and evidence fit inside pages');
 check(sheets.every(p=>{const side=p.querySelector('.ed-side');if(w.getComputedStyle(side).display==='none')return true;const a=side.getBoundingClientRect(),b=p.getBoundingClientRect();return a.right<=b.right+1&&a.bottom<=b.bottom+1}),'Printed sidebar stays inside every sheet');
 check(w.getComputedStyle(sheets.at(-1)).breakAfter==='auto','No forced blank page after final sheet');printStyle.remove();
 const expected=d.querySelectorAll('.pg').length,linkPage=[...d.querySelectorAll('.pg')].indexOf(d.querySelector('.ed-section-link').closest('.pg'))+1;
 const blob=await w.makePDF();
 const pdf=await w.pdfjsLib.getDocument({data:new Uint8Array(await blob.arrayBuffer())}).promise;check(pdf.numPages===expected,'Full PDF export preserves all '+expected+' pages');const page=await pdf.getPage(linkPage),annotations=await page.getAnnotations();check(annotations.some(a=>a.url==='https://example.com/evidence?x=1&y=2'),'Exported PDF has clickable URL');check(Math.abs(page.view[2]/page.view[3]-297/167.1)<.01,'Export geometry matches preview');await pdf.destroy();
 result.textContent=logs.join('\n')+'\nALL CHECKS PASSED';
 }catch(e){result.textContent=logs.join('\n')+'\nFAIL '+e.stack}
 finally{d?.querySelector('#test-print-rules')?.remove();if(original){w.eval('S='+JSON.stringify(original));w.eval('fill();secPanel();pages()');await w.saveDB()}}
};
</script>
